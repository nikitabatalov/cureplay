name: Build CurePlay Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore CurePlay/CurePlay.csproj -r win-x64
      - name: Publish single-file EXE
        run: dotnet publish CurePlay/CurePlay.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:DebugSymbols=false --no-restore -o publish
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: CurePlay-v1-win-x64
          path: publish/CurePlay.exe
          if-no-files-found: error
